name: Deploy EMA Landing Page

on:
  push:
    branches: 
      - master
      - arabic
      - french
      - portuguese

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set environment variables based on branch
      id: vars
      run: |
        case "${{ github.ref_name }}" in
          master)
            echo "IMAGE_NAME=ema-app" >> $GITHUB_OUTPUT
            echo "CONTAINER_SUFFIX=en" >> $GITHUB_OUTPUT
            ;;
          arabic)
            echo "IMAGE_NAME=ema-app-ar" >> $GITHUB_OUTPUT
            echo "CONTAINER_SUFFIX=ar" >> $GITHUB_OUTPUT
            ;;
          french)
            echo "IMAGE_NAME=ema-app-fr" >> $GITHUB_OUTPUT
            echo "CONTAINER_SUFFIX=fr" >> $GITHUB_OUTPUT
            ;;
          portuguese)
            echo "IMAGE_NAME=ema-app-pt" >> $GITHUB_OUTPUT
            echo "CONTAINER_SUFFIX=pt" >> $GITHUB_OUTPUT
            ;;
        esac
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/${{ steps.vars.outputs.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        secrets: |
          VITE_GEMINI_KEY_1=${{ secrets.VITE_GEMINI_KEY_1 }}
          VITE_GEMINI_KEY_2=${{ secrets.VITE_GEMINI_KEY_2 }}
          VITE_GEMINI_KEY_3=${{ secrets.VITE_GEMINI_KEY_3 }}
    
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.PORT || 22 }}
        script: |
          cd /opt/ema-landing
          docker compose pull ema-app-${{ steps.vars.outputs.CONTAINER_SUFFIX }} || docker-compose pull ema-app-${{ steps.vars.outputs.CONTAINER_SUFFIX }}
          docker compose up -d ema-app-${{ steps.vars.outputs.CONTAINER_SUFFIX }} || docker-compose up -d ema-app-${{ steps.vars.outputs.CONTAINER_SUFFIX }}
          docker image prune -f
