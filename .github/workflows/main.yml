name: Deploy EMA Landing Page

on:
  push:
    branches: [ master ]

env:
  IMAGE_NAME: ema-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        # -- ADDED SECRETS HERE --
        secrets: |
          VITE_GEMINI_KEY_1=${{ secrets.VITE_GEMINI_KEY_1 }}
          VITE_GEMINI_KEY_2=${{ secrets.VITE_GEMINI_KEY_2 }}
          VITE_GEMINI_KEY_3=${{ secrets.VITE_GEMINI_KEY_3 }}
    
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.PORT || 22 }}
        script: |
          cd /opt/ema-landing
          # The secrets are already baked into the image, so no need to create a .env file
          docker compose pull || docker-compose pull
          docker compose down || docker-compose down
          docker compose up -d || docker-compose up -d
          docker image prune -f
